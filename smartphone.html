<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RemoteCamera — Scanner</title>
<style>
  /* ── Reset & base ─────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0f;
    --surface:   #13131a;
    --border:    rgba(255,255,255,0.08);
    --accent:    #6750A4;
    --accent2:   #0EA5E9;
    --success:   #22c55e;
    --error:     #ef4444;
    --warning:   #f59e0b;
    --text:      #f0f0f8;
    --muted:     rgba(240,240,248,0.45);
    --scan-line: rgba(103,80,164,0.7);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    user-select: none;
  }

  /* ── Layout principal ────────────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    position: relative;
  }

  /* ── Header status ──────────────────────────────────── */
  #header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    background: linear-gradient(to bottom, rgba(10,10,15,0.95), transparent);
  }

  #ws-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  #ws-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--error);
    box-shadow: 0 0 6px currentColor;
    transition: background 0.3s, box-shadow 0.3s;
  }
  #ws-dot.connected    { background: var(--success); box-shadow: 0 0 10px var(--success); }
  #ws-dot.connecting   { background: var(--warning); box-shadow: 0 0 10px var(--warning); animation: pulse 1s infinite; }

  #mode-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(103,80,164,0.25);
    border: 1px solid rgba(103,80,164,0.5);
    color: #c4b5fd;
  }

  /* ── Vidéo plein écran ──────────────────────────────── */
  #video-wrap {
    position: absolute;
    inset: 0;
    background: #000;
    overflow: hidden;
  }

  #camera {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1); /* miroir pour cam frontale */
  }
  #camera.environment { transform: scaleX(1); }

  /* ── Canvas overlay (face detection) ──────────────────── */
  #face-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: none;
  }

  /* ── Overlay QR cadre ────────────────────────────────── */
  #qr-frame {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  #qr-box {
    width: min(65vw, 260px);
    height: min(65vw, 260px);
    position: relative;
  }

  /* Coins du cadre QR */
  .corner {
    position: absolute;
    width: 28px; height: 28px;
    border-color: var(--accent);
    border-style: solid;
    border-width: 0;
  }
  .corner.tl { top: 0; left: 0;  border-top-width: 3px; border-left-width: 3px;  border-radius: 4px 0 0 0; }
  .corner.tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-radius: 0 4px 0 0; }
  .corner.bl { bottom: 0; left: 0;  border-bottom-width: 3px; border-left-width: 3px;  border-radius: 0 0 0 4px; }
  .corner.br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 4px 0; }

  /* Ligne scan animée */
  #scan-line {
    position: absolute;
    left: 4px; right: 4px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--scan-line), transparent);
    border-radius: 2px;
    animation: scanLine 2s ease-in-out infinite;
    box-shadow: 0 0 8px var(--accent);
  }

  @keyframes scanLine {
    0%   { top: 8px; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { top: calc(100% - 10px); opacity: 0; }
  }

  /* Zone sombre autour du cadre QR */
  #qr-mask {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 9;
  }

  /* ── Footer controls ─────────────────────────────────── */
  #footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 30;
    padding: 16px 20px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,10,15,0.95) 60%, transparent);
  }

  #feedback {
    text-align: center;
    margin-bottom: 14px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #feedback-text {
    font-size: 15px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    transition: all 0.3s;
    max-width: 100%;
    text-align: center;
    line-height: 1.4;
  }
  #feedback-text.success { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); color: #86efac; }
  #feedback-text.error   { background: rgba(239,68,68,0.15);  border-color: rgba(239,68,68,0.4);  color: #fca5a5; }
  #feedback-text.warning { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4); color: #fcd34d; }
  #feedback-text.info    { background: rgba(14,165,233,0.15); border-color: rgba(14,165,233,0.4); color: #7dd3fc; }

  /* Boutons de mode */
  #mode-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .mode-btn {
    flex: 1;
    max-width: 160px;
    padding: 12px 8px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-btn .icon { font-size: 22px; }
  .mode-btn.active {
    border-color: var(--accent);
    background: rgba(103,80,164,0.2);
    color: #c4b5fd;
    box-shadow: 0 0 16px rgba(103,80,164,0.25);
  }
  .mode-btn:active { transform: scale(0.96); }

  /* ── Écran de connexion ──────────────────────────────── */
  #connect-screen {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 32px 24px;
    gap: 24px;
  }
  #connect-screen.hidden { display: none; }

  .logo-mark {
    width: 72px; height: 72px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    box-shadow: 0 8px 32px rgba(103,80,164,0.4);
  }

  #connect-screen h1 {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
  }

  #connect-screen p {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
    max-width: 300px;
  }

  #ws-url-input {
    width: 100%;
    max-width: 320px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-family: 'Courier New', monospace;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  #ws-url-input:focus { border-color: var(--accent); }

  #connect-btn {
    width: 100%;
    max-width: 320px;
    padding: 15px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.03em;
    box-shadow: 0 4px 20px rgba(103,80,164,0.4);
    transition: opacity 0.2s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  #connect-btn:active { transform: scale(0.98); opacity: 0.9; }

  #connect-hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }

  /* ── Flash de confirmation ──────────────────────────── */
  #flash {
    position: absolute;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
  }
  #flash.success { background: rgba(34,197,94,0.3); }
  #flash.error   { background: rgba(239,68,68,0.3); }

  /* ── Animations ─────────────────────────────────────── */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  #connect-screen > * {
    animation: slideUp 0.4s ease both;
  }
  #connect-screen > *:nth-child(1) { animation-delay: 0.05s; }
  #connect-screen > *:nth-child(2) { animation-delay: 0.10s; }
  #connect-screen > *:nth-child(3) { animation-delay: 0.15s; }
  #connect-screen > *:nth-child(4) { animation-delay: 0.20s; }
  #connect-screen > *:nth-child(5) { animation-delay: 0.25s; }
  #connect-screen > *:nth-child(6) { animation-delay: 0.30s; }
</style>
</head>
<body>
<div id="app">

  <!-- ── Écran connexion ────────────────────────────── -->
  <div id="connect-screen">
    <div class="logo-mark">📷</div>
    <h1>RemoteCamera<br>Scanner</h1>
    <p>Connectez-vous au Chromebook via le réseau Wi-Fi partagé par ce téléphone.</p>
    <input type="text" id="ws-url-input"
      placeholder="ws://192.168.43.100:8765"
      inputmode="url"
      autocomplete="off"
      spellcheck="false">
    <button id="connect-btn" onclick="connectWS()">Se connecter</button>
    <p id="connect-hint">
      L'adresse IP du Chromebook s'affiche dans le terminal<br>
      quand vous lancez <strong>python3 server.py</strong>
    </p>
  </div>

  <!-- ── Caméra ─────────────────────────────────────── -->
  <div id="video-wrap">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="face-canvas"></canvas>

    <!-- Masque QR -->
    <svg id="qr-mask" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="hole-mask">
          <rect width="100%" height="100%" fill="white"/>
          <rect id="hole-rect" x="50%" y="50%" width="0" height="0" rx="8" fill="black"/>
        </mask>
      </defs>
      <rect width="100%" height="100%"
        fill="rgba(0,0,0,0.5)"
        mask="url(#hole-mask)"/>
    </svg>

    <!-- Cadre QR -->
    <div id="qr-frame">
      <div id="qr-box">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div id="scan-line"></div>
      </div>
    </div>
  </div>

  <!-- ── Flash feedback ─────────────────────────────── -->
  <div id="flash"></div>

  <!-- ── Header ─────────────────────────────────────── -->
  <div id="header">
    <div id="ws-status">
      <div id="ws-dot"></div>
      <span id="ws-label">Déconnecté</span>
    </div>
    <div id="mode-badge">QR</div>
  </div>

  <!-- ── Footer ─────────────────────────────────────── -->
  <div id="footer">
    <div id="feedback">
      <div id="feedback-text" class="info">Pointez la caméra vers un QR Code</div>
    </div>
    <div id="mode-controls">
      <button class="mode-btn active" id="btn-qr" onclick="setMode('qr')">
        <span class="icon">⬛</span>
        <span>QR Code</span>
      </button>
      <button class="mode-btn" id="btn-face" onclick="setMode('face')">
        <span class="icon">👤</span>
        <span>Visage</span>
      </button>
    </div>
  </div>

</div>

<!-- jsQR (même lib que le projet principal) -->
<script src="jsQR.min.js" onerror="loadJsQRFallback()"></script>

<script>
// ══════════════════════════════════════════════════════════════
// RemoteCamera Smartphone Client
// Mode hybride : détection mobile → envoi résultat → validation PC
// ══════════════════════════════════════════════════════════════

'use strict';

// ── État ─────────────────────────────────────────────────────
let ws            = null;
let wsUrl         = '';
let stream        = null;
let mode          = 'qr';      // 'qr' | 'face'
let scanning      = false;
let scanInterval  = null;
let faceInterval  = null;
let lastQRSent    = 0;
let reconnectTimer = null;
let reconnectDelay = 2000;

const QR_COOLDOWN_MS   = 2500;   // anti-doublon QR
const FACE_INTERVAL_MS = 500;    // fréquence envoi descripteur facial

// ── Fallback jsQR CDN ─────────────────────────────────────────
function loadJsQRFallback() {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
  document.head.appendChild(s);
}

// ── Éléments DOM ──────────────────────────────────────────────
const $  = id => document.getElementById(id);
const video        = $('camera');
const faceCanvas   = $('face-canvas');
const connectScreen = $('connect-screen');
const wsUrlInput   = $('ws-url-input');
const wsDot        = $('ws-dot');
const wsLabel      = $('ws-label');
const modeBadge    = $('mode-badge');
const feedbackText = $('feedback-text');
const qrFrame      = $('qr-frame');
const flash        = $('flash');
const holeRect     = $('hole-rect');

// ── Pré-remplissage URL (Android hotspot gateway → cherche le Chromebook) ──
(function guessWsUrl() {
  const saved = localStorage.getItem('remote_camera_ws_url');
  if (saved) { wsUrlInput.value = saved; return; }
  // Sur hotspot Android, le téléphone est 192.168.43.1
  // Le Chromebook reçoit une IP dans 192.168.43.x
  wsUrlInput.value = 'ws://192.168.43.100:8765';
})();

// ── Connexion WebSocket ───────────────────────────────────────
function connectWS() {
  wsUrl = wsUrlInput.value.trim();
  if (!wsUrl.startsWith('ws://') && !wsUrl.startsWith('wss://')) {
    wsUrl = 'ws://' + wsUrl;
    wsUrlInput.value = wsUrl;
  }

  localStorage.setItem('remote_camera_ws_url', wsUrl);
  setStatus('connecting', 'Connexion...');

  try {
    ws = new WebSocket(wsUrl);
  } catch (e) {
    setStatus('error', 'URL invalide');
    return;
  }

  ws.onopen = () => {
    reconnectDelay = 2000;
    clearTimeout(reconnectTimer);
    setStatus('connected', 'Connecté');
    connectScreen.classList.add('hidden');

    ws.send(JSON.stringify({ type: 'identify', role: 'smartphone' }));
    startCamera();
  };

  ws.onmessage = e => {
    try {
      handleMessage(JSON.parse(e.data));
    } catch (_) {}
  };

  ws.onclose = () => {
    setStatus('error', 'Déconnecté');
    // Reconnexion automatique
    reconnectTimer = setTimeout(() => {
      if (wsUrl) connectWS();
    }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 15000);
  };

  ws.onerror = () => {
    setStatus('error', 'Erreur WS');
  };
}

// ── Gestion messages entrants ──────────────────────────────────
function handleMessage(msg) {
  switch (msg.type) {
    case 'identified':
      setFeedback('✓ Connecté au Chromebook', 'success');
      break;

    case 'ack': {
      const result = msg.result;
      const name   = msg.name || '';
      const time   = msg.time || '';
      if (result === 'arrival') {
        setFeedback(`✓ Arrivée : ${name} — ${time}`, 'success');
        flashScreen('success');
        vibrate([100, 50, 100]);
      } else if (result === 'departure') {
        setFeedback(`✓ Départ : ${name} — ${time}`, 'success');
        flashScreen('success');
        vibrate([100]);
      } else if (result === 'blocked') {
        setFeedback(`⏱ Bloqué — ${msg.message || ''}`, 'warning');
        vibrate([300]);
      } else if (result === 'error') {
        setFeedback(`✗ ${msg.message || 'Erreur'}`, 'error');
        flashScreen('error');
        vibrate([500]);
      } else if (result === 'not_found') {
        setFeedback(`✗ Employé non trouvé`, 'error');
        flashScreen('error');
        vibrate([500]);
      }
      break;
    }

    case 'pong':
      break;

    default:
      break;
  }
}

// ── Démarrage caméra ───────────────────────────────────────────
async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  const facingMode = mode === 'face' ? 'user' : 'environment';

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width:  { ideal: 1280 },
        height: { ideal: 720 },
      },
      audio: false,
    });

    video.srcObject = stream;
    video.className = facingMode === 'environment' ? 'environment' : '';

    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();

    scanning = true;
    startScanLoop();

  } catch (err) {
    setFeedback(`Caméra : ${err.message}`, 'error');
  }
}

// ── Boucle de scan ─────────────────────────────────────────────
function startScanLoop() {
  stopScanLoop();

  if (mode === 'qr') {
    startQRScan();
  } else if (mode === 'face') {
    startFaceScan();
  }
}

function stopScanLoop() {
  if (scanInterval)  { clearInterval(scanInterval);  scanInterval = null; }
  if (faceInterval)  { clearInterval(faceInterval);  faceInterval = null; }
}

// ── Mode QR ───────────────────────────────────────────────────
function startQRScan() {
  const canvas = document.createElement('canvas');
  const ctx    = canvas.getContext('2d');

  qrFrame.style.display   = 'flex';
  faceCanvas.style.display = 'none';
  updateQRMask();

  scanInterval = setInterval(() => {
    if (!scanning) return;
    if (video.readyState < video.HAVE_ENOUGH_DATA) return;
    if (Date.now() - lastQRSent < QR_COOLDOWN_MS) return;

    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

    if (typeof jsQR === 'undefined') return;

    const code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert',
    });

    if (code && code.data) {
      lastQRSent = Date.now();
      sendQRResult(code.data);
    }
  }, 200);
}

function sendQRResult(data) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    setFeedback('⚠ Non connecté', 'warning');
    return;
  }

  setFeedback('📷 Code scanné — envoi...', 'info');
  ws.send(JSON.stringify({
    type: 'qr_result',
    data: data.trim(),
    ts:   new Date().toISOString(),
  }));
}

// ── Mode Facial ───────────────────────────────────────────────
// Note : En mode hybride, le smartphone détecte et envoie le descripteur
// brut (128D float array) — la reconnaissance (matching) est faite sur le PC.
// Si face-api n'est pas disponible sur smartphone, on envoie un frame JPEG.

let faceApiAvailable = false;

async function checkFaceApi() {
  if (typeof faceapi !== 'undefined') {
    faceApiAvailable = true;
    return true;
  }
  return false;
}

function startFaceScan() {
  qrFrame.style.display    = 'none';
  faceCanvas.style.display = 'block';

  faceCanvas.width  = video.videoWidth  || 640;
  faceCanvas.height = video.videoHeight || 480;

  checkFaceApi().then(available => {
    if (available) {
      startFaceApiScan();
    } else {
      startFrameScan();
    }
  });
}

// Option A : face-api disponible → envoi descripteur 128D
async function startFaceApiScan() {
  setFeedback('Chargement modèles...', 'info');

  try {
    const MODEL_URL = '/model';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
    ]);
    setFeedback('👤 Scan facial actif', 'info');
  } catch (e) {
    // Fallback si modèles non disponibles localement
    startFrameScan();
    return;
  }

  const ctx = faceCanvas.getContext('2d');
  let lastSent = 0;

  faceInterval = setInterval(async () => {
    if (!scanning) return;
    if (Date.now() - lastSent < FACE_INTERVAL_MS) return;

    try {
      const det = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();

      // Redessine le canvas
      faceCanvas.width  = video.videoWidth;
      faceCanvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);

      if (det) {
        // Dessine le cadre de détection
        const box = det.detection.box;
        ctx.strokeStyle = '#6750A4';
        ctx.lineWidth = 3;
        ctx.strokeRect(box.x, box.y, box.width, box.height);
        ctx.fillStyle = 'rgba(103,80,164,0.15)';
        ctx.fillRect(box.x, box.y, box.width, box.height);

        // Envoie le descripteur 128D
        if (ws && ws.readyState === WebSocket.OPEN) {
          lastSent = Date.now();
          ws.send(JSON.stringify({
            type:       'face_data',
            descriptor: Array.from(det.descriptor),
            ts:         new Date().toISOString(),
          }));
        }
      } else {
        // Aucun visage
        ctx.clearRect(0, 0, faceCanvas.width, faceCanvas.height);
        ctx.drawImage(video, 0, 0);
      }
    } catch (_) {}
  }, 200);
}

// Option B : pas de face-api → envoi frame JPEG compressé
function startFrameScan() {
  setFeedback('📡 Mode flux — en attente', 'info');
  const canvas = document.createElement('canvas');
  const ctx    = canvas.getContext('2d');
  let   lastSent = 0;

  faceInterval = setInterval(() => {
    if (!scanning) return;
    if (Date.now() - lastSent < 800) return; // max ~1.25fps pour le flux
    if (video.readyState < video.HAVE_ENOUGH_DATA) return;

    canvas.width  = 320; // réduit pour la bande passante LAN
    canvas.height = 240;
    ctx.drawImage(video, 0, 0, 320, 240);

    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
    if (ws && ws.readyState === WebSocket.OPEN) {
      lastSent = Date.now();
      ws.send(JSON.stringify({
        type:  'face_frame',
        frame: dataUrl,
        ts:    new Date().toISOString(),
      }));
    }
  }, 200);
}

// ── Changement de mode ─────────────────────────────────────────
function setMode(newMode) {
  mode = newMode;

  $('btn-qr').classList.toggle('active',   mode === 'qr');
  $('btn-face').classList.toggle('active', mode === 'face');
  modeBadge.textContent = mode === 'qr' ? 'QR' : 'FACIAL';

  stopScanLoop();
  startCamera(); // Redémarre avec la bonne caméra (environment/user)

  setFeedback(
    mode === 'qr'
      ? 'Pointez la caméra vers un QR Code'
      : '👤 Placez votre visage dans le cadre',
    'info'
  );
}

// ── Utilitaires UI ─────────────────────────────────────────────
function setStatus(state, label) {
  wsDot.className   = state === 'connected' ? 'connected'
                     : state === 'connecting' ? 'connecting' : '';
  wsLabel.textContent = label;
}

function setFeedback(text, type = 'info') {
  feedbackText.textContent  = text;
  feedbackText.className    = type;
}

function flashScreen(type) {
  flash.className = type;
  flash.style.opacity = '1';
  setTimeout(() => { flash.style.opacity = '0'; flash.className = ''; }, 200);
}

function vibrate(pattern) {
  if (navigator.vibrate) {
    navigator.vibrate(pattern);
  }
}

// Masque SVG adapté à la taille du cadre QR
function updateQRMask() {
  const box    = $('qr-box');
  const frame  = $('qr-frame');
  if (!box || !holeRect) return;

  const bRect  = box.getBoundingClientRect();
  const fRect  = frame.getBoundingClientRect();

  holeRect.setAttribute('x',      bRect.left - fRect.left);
  holeRect.setAttribute('y',      bRect.top  - fRect.top);
  holeRect.setAttribute('width',  bRect.width);
  holeRect.setAttribute('height', bRect.height);
}

window.addEventListener('resize', updateQRMask);
window.addEventListener('orientationchange', () => {
  setTimeout(updateQRMask, 300);
});

// ── Ping keepalive ─────────────────────────────────────────────
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ping' }));
  }
}, 15000);

// ── Init ───────────────────────────────────────────────────────
setTimeout(updateQRMask, 100);
</script>
